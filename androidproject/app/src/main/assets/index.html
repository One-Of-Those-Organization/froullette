<!doctype html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Fate Roullete</title>
    <style>
        body {
            font-family: arial;
            margin: 0;
            padding: 0;
            background-color: #000;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
        }

        .spinner {
            height: 30px;
            width: 30px;
            margin: 10px;
            border-left: 5px solid #ebebeb;
            border-right: 5px solid #ebebeb;
            border-bottom: 5px solid #ebebeb;
            border-top: 5px solid #787878;
            border-radius: 100%;
            animation: rotation .8s linear infinite;
        }

        @keyframes rotation {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        #status {
            font-weight: bold;
            color: #787878;
            margin-bottom: 10px;
        }

        .emscripten_border {
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }

        canvas.emscripten {
            border: 0 none;
            background-color: #000;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            cursor: none;
        }

        #output, #progress, #controls {
            display: none !important;
        }
    </style>
</head>
<body>

<input type="text" id="hiddenInput"
       style="opacity: 0.01; position: absolute; z-index: -1; top: 0; left: 0; width: 100px; height: 30px; pointer-events: auto;"
       autocomplete="off"
       autocorrect="off"
       autocapitalize="off"
       spellcheck="false"
       inputmode="text">

<div class="spinner" id="spinner"></div>
<div id="status">Downloading...</div>
<progress hidden id="progress" max="100" value="0"></progress>

<div class="emscripten_border">
    <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
</div>

<textarea id="output" rows="8" style="display:none"></textarea>

<script>
    var hiddenInput = document.getElementById("hiddenInput");

    // 1. CEGAH RAYLIB MEMBAJAK TOMBOL
    ['keydown', 'keyup', 'keypress'].forEach(function(evt) {
        hiddenInput.addEventListener(evt, function(e) {
            e.stopPropagation();
        });
    });

    // 2. SOLUSI BACKSPACE MANUAL (JURUS PAMUNGKAS)
    hiddenInput.addEventListener("keydown", function(e) {
        // Jika tombol Backspace ditekan
        if (e.key === "Backspace" || e.keyCode === 8) {

            var valueBefore = hiddenInput.value;

            // Kita tunggu sekejap (0ms) untuk melihat apakah browser menghapusnya sendiri?
            setTimeout(function() {
                // Jika isinya MASIH SAMA (berarti browser gagal menghapus karena kursor macet di awal)
                // DAN panjang teks > 0
                if (hiddenInput.value === valueBefore && hiddenInput.value.length > 0) {

                    // KITA HAPUS PAKSA HURUF TERAKHIR LEWAT SCRIPT
                    hiddenInput.value = valueBefore.slice(0, -1);

                    // Console log untuk debug
                    console.log("Manual Backspace Triggered!");
                }

                // Apapun yang terjadi, kembalikan kursor ke paling ujung kanan
                var len = hiddenInput.value.length;
                hiddenInput.setSelectionRange(len, len);

            }, 0);
        }
    });

    // 3. PAKSA KURSOR KE UJUNG SAAT DI-KLIK / FOKUS
    function forceCursorEnd() {
        // Delay sedikit agar keyboard muncul dulu
        setTimeout(function() {
            var len = hiddenInput.value.length;
            hiddenInput.setSelectionRange(len, len);
            // Scroll ke kanan mentok biar kelihatan (jika input panjang)
            hiddenInput.scrollLeft = hiddenInput.scrollWidth;
        }, 100);
    }

    hiddenInput.addEventListener("focus", forceCursorEnd);
    hiddenInput.addEventListener("click", forceCursorEnd);
    hiddenInput.addEventListener("touchstart", forceCursorEnd); // Tambahan untuk mobile

    // --- KONFIGURASI EMSCRIPTEN ---
    var statusElement = document.getElementById("status"),
        progressElement = document.getElementById("progress"),
        spinnerElement = document.getElementById("spinner"),
        canvasElement = document.getElementById("canvas");

    var Module = {
        print: function(text) { console.log(text); },
        canvas: canvasElement,
        setStatus: function(text) {
            if (!Module.setStatus.last) Module.setStatus.last = { time: Date.now(), text: "" };
            if (text === Module.setStatus.last.text) return;
            var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
            var now = Date.now();
            if (m && now - Module.setStatus.last.time < 30) return;
            Module.setStatus.last.time = now;
            Module.setStatus.last.text = text;
            if (m) {
                text = m[1];
                progressElement.value = parseInt(m[2]) * 100;
                progressElement.max = parseInt(m[4]) * 100;
                progressElement.hidden = false;
                spinnerElement.hidden = false;
            } else {
                progressElement.value = null;
                progressElement.max = null;
                progressElement.hidden = true;
                if (!text) {
                    spinnerElement.style.display = "none";
                    statusElement.style.display = "none";
                }
            }
            statusElement.innerHTML = text;
        },
        totalDependencies: 0,
        monitorRunDependencies: function(left) {
            this.totalDependencies = Math.max(this.totalDependencies, left);
            Module.setStatus(left ? "Preparing... (" + (this.totalDependencies - left) + "/" + this.totalDependencies + ")" : "All downloads complete.");
        }
    };

    Module.onRuntimeInitialized = function () {
        const canvas = document.getElementById("canvas");
        function unlock() {
            canvas.dispatchEvent(new KeyboardEvent("keydown", { key: " ", code: "Space" }));
            canvas.dispatchEvent(new KeyboardEvent("keyup", { key: " ", code: "Space" }));
            document.removeEventListener("click", unlock);
            document.removeEventListener("touchstart", unlock);
        }
        document.addEventListener("click", unlock);
        document.addEventListener("touchstart", unlock);
    };

    Module.setStatus("Downloading...");
    window.onerror = function(event) {
        Module.setStatus("Exception thrown, see JavaScript console");
        spinnerElement.style.display = "none";
        Module.setStatus = function(text) {
            if (text) console.error("[post-exception status] " + text);
        };
    };
</script>
<script async src="froullete.js"></script>
</body>
</html>
